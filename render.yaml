# Free hosting only, as authorized. Automatic inspection worker is deferred.
# Dedicated Supabase database/bucket and hosted authentication are required.
services:
  - type: web
    name: pack-manager-web
    runtime: docker
    region: singapore
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/ready
    dockerCommand: python -m backend.service
    envVars:
      - fromGroup: pack-manager-runtime
envVarGroups:
  - name: pack-manager-runtime
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_MODE
        value: supabase
      - key: WORKER_ENABLED
        value: "false"
      - key: MODEL_PROVIDER
        value: none
      - key: PACK_ORGANIZATION
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: DEMO_ENABLED
        value: "false"
      - key: DAILY_MODEL_LIMIT
        value: "10"
