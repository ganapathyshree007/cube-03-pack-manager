# Render Blueprint for CUBE Pack Manager
# Production Architecture: Render Managed PostgreSQL + Render FastAPI Web Service + Gemini Vision Provider
databases:
  - name: pack-manager-db
    databaseName: pack_manager
    user: pack_user
    plan: free

services:
  - type: web
    name: pack-manager-web
    runtime: docker
    region: singapore
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pack-manager-db
          property: connectionString
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: HOSTED_MODEL_REVIEW_REQUIRED
        value: "true"
      - key: WORKER_ENABLED
        value: "true"
      - key: AUTH_MODE
        value: local
      - key: STORAGE_MODE
        value: local
      - key: STORAGE_ROOT
        value: /app/.local/images
      - key: ALLOWED_ORIGINS
        sync: false
