[project]
name = "pack-manager"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "pillow",
    "openai",
    "azure-identity",
    "azure-storage-blob",
    "pyjwt[crypto]",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.optional-dependencies]
evaluation = ["matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
