services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/local-init.sql:/docker-entrypoint-initdb.d/01-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pack"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:local-admin-only@db:5432/pack
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pack_app:local-development-only@db:5432/pack
      STORAGE_ROOT: /app/.local/images
    volumes: ["images:/app/.local/images"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pack_app:local-development-only@db:5432/pack
      STORAGE_ROOT: /app/.local/images
    volumes: ["images:/app/.local/images"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres:
  images:
