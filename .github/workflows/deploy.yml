name: Deploy approved Azure scope
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Previously tested commit SHA to build and deploy'
        required: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: azure-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.image_tag }}'}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Write non-secret deployment parameters
        env:
          PARAMETERS: ${{ vars.APPLICATION_PARAMETERS_JSON }}
        run: |
          mkdir -p .local
          printf '%s' "$PARAMETERS" > .local/application.parameters.json
      - name: Build, deploy, migrate and verify readiness
        shell: pwsh
        env:
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
          PREFIX: ${{ vars.AZURE_PREFIX }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: ./scripts/deploy.ps1 -Subscription $env:SUBSCRIPTION -ResourceGroup $env:RESOURCE_GROUP -Registry $env:REGISTRY -Prefix $env:PREFIX -ImageTag $env:IMAGE_TAG -ApplicationParameters .local/application.parameters.json
